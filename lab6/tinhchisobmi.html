<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
</head>
<body>
    <h2>Tính chỉ số BMI</h2>
    
    <label>Nhập chiều cao (m):</label>
    <input type="number" step="0.01" id="txtChieuCao"><br><br>
    
    <label>Nhập cân nặng (kg):</label>
    <input type="number" step="0.1" id="txtCanNang"><br><br>
    
    <button onclick="tinhBMI()">Tính BMI</button>
    
    <div id="ketQuaBMI"></div>

    <script>
        function tinhBMI() {
            let chieuCao = parseFloat(document.getElementById("txtChieuCao").value);
            let canNang = parseFloat(document.getElementById("txtCanNang").value);
            
            if (isNaN(chieuCao) || isNaN(canNang) || chieuCao <= 0 || canNang <= 0) {
                alert("Vui lòng nhập chiều cao và cân nặng hợp lệ lớn hơn 0!");
                return;
            }

            let bmi = canNang / (chieuCao * chieuCao);
            let bmiLamTron = bmi.toFixed(2);
            let ketLuan = "";

            if (bmi < 18.5) {
                ketLuan = "Gầy";
            } else if (bmi >= 18.5 && bmi < 25) {
                ketLuan = "Bình thường";
            } else if (bmi >= 25 && bmi < 30) {
                ketLuan = "Thừa cân";
            } else {
                ketLuan = "Béo phì";
            }

            document.getElementById("ketQuaBMI").innerHTML = "<br>Chỉ số BMI của bạn là: " + bmiLamTron + "<br>Kết luận: " + ketLuan;
        }
    </script>
</body>
</html>

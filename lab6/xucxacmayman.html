<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Chương trình Xúc xắc may mắn!</h2>
    <button onclick="xucxac()"> Xúc xắc </button>
    <p id="ketqua"></p>
    <script>
        function xucxac() {
            let ketqua = Math.floor(Math.random() * 6) + 1;
            document.getElementById("ketqua").innerText = "Kết quả: " + ketqua;
        }
    </script>
</body>
</html>

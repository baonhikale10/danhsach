<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> ❤️ XEM BOI TINH YEU ❤️</h2>
    <label for=""> Nhap ten ban: </label>
    <input type="text" name="" id="tenban">
    <br>
    <label for=""> Nhap ten nguoi ay ❤️: </label>
    <input type="text" name="" id="tennguoiay">
    <br> <br>
    <button onclick="xemboi()"> Xem boi </button>
    <h3 id="ketqua"></h3>

    <script>
        function xemboi() {
            let tenban = document.getElementById("tenban").value;
            let tennguoiay = document.getElementById("tennguoiay").value;
            let ketqua = Math.floor(Math.random() * 100) + 1;
            if (ketqua > 50){
                document.getElementById("ketqua").innerHTML = 
                tenban + "❤️" + tennguoiay + ".Diem:" + ketqua + ". Chuc hai ban hanh phuc!";
            } else {
                document.getElementById("ketqua").innerHTML = 
                tenban + "❤️" + tennguoiay + ".Diem:" + ketqua + ". Co chac la ben lau!";
            }
        }
    </script>
</body>
</html>

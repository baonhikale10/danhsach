<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Chuong trinh tinh tuoi </h2>
    <label for=""> Nhap vao nam sinh cua ban: </label>
    <input type="number" id="namsinh">
    <br> <br>
    <button onclick="tinhtuoi()"> tinh tuoi </button>
    <p id="ketqua"></p>

    <script>
        function tinhtuoi(){
            let yourBirth = document.getElementById("namsinh").value;
            let currentYear = 2026;
            let yourAge = currentYear - yourBirth;
            document.getElementById("ketqua").innerText = "Tuoi cua ban la: " + yourAge;
        }
    </script>
</body>
</html>
